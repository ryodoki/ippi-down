[pytest]
# pytest設定ファイル

# テストファイルのパターン
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# テストディレクトリ
testpaths = tests

# カバレッジ設定
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# マーカー定義
markers =
    unit: 単体テスト
    integration: 統合テスト
    slow: 実行に時間がかかるテスト
    network: ネットワーク接続が必要なテスト

# ログ設定
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S


[pytest]
# pytest設定

# テストディレクトリ
testpaths = tests

# Pythonパス
pythonpath = .

# テストファイルのパターン
python_files = test_*.py

# テストクラスのパターン
python_classes = Test*

# テスト関数のパターン
python_functions = test_*

# マーカー定義
markers =
    gui: GUI依存テスト（デフォルトでスキップ）
    network: ネットワーク依存テスト（デフォルトでスキップ）
    integration: 統合テスト（デフォルトでスキップ）
    slow: 実行に時間がかかるテスト

# デフォルトでスキップするマーカー
addopts = 
    -m "not gui and not network and not integration"
    --tb=short
    -v
    --timeout=30
    --timeout-method=thread
    --durations=10
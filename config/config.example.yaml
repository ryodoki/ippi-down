# ppi-file-downloader 設定ファイル例

# 対象URL（search_targetと一致させる。業務は末尾をtab=7にする）
target_urls:
  - https://www.i-ppi.jp/IPPI/SearchServices/Web/Search/Search/Search.aspx?tab=4

# ダウンロード条件
download_conditions:
  file_types:
    - .pdf
    - .xlsx
    - .docx
  keywords: []  # 空の場合はすべて
  date_range:
    start: null  # YYYY-MM-DD形式
    end: null

# ダウンロードデータルートと保存構成。v4は工事／業務を最上位で分離します。
save_paths:
  local: ./downloads  # プロジェクトルートまたはexe配置場所を基準に解決
  layout_version: 4
  normal_folder: 01_通常ダウンロード
  scheduled_folder: 02_定期実行
  # 定期実行スナップショットでは登録時に自動設定されます。
  schedule_storage_key: ""
  schedule_storage_folder: ""

# ファイル命名規則
# 使用可能な変数:
# {filename}, {file_type}, {category}, {title}, {date}, {index},
# {daibunrui}, {chubunrui}, {shoubunrui}, {saibunrui},
# {project_name}, {koji_name}（互換別名）,
# {document_name}, {document_updated_at}, {document_id},
# {document_status}, {document_expires_at}, {document_section}
naming_rule: "{document_name}_{document_updated_at}"

# 検索条件（GUIでは表示名を選択し、送信時に対象サイトのvalueへ変換）
search_conditions:
  search_target: koji_keika  # koji_keika / gyomu_keika
  project_name: ""           # 工事名または業務名
  hachu_daibunrui: ""
  hachu_chubunrui: ""
  hachu_shoubunrui: ""
  hachu_saibunrui: ""
  hachu_multi: []  # 将来機能。値がある旧設定は実行時に無効化
  koji_name: ""
  place_search_type: list  # list / text
  place_chihou: ""
  place_todofuken: ""
  place_shichouson: ""
  place_text: ""
  contract_types:
    - 一般競争入札
    - 公募型指名競争入札
    - 指名競争入札
    - 随意契約
    - その他方式
  update_date_type: none  # none / past
  update_date_days: null
  koukoku_date_type: none  # none / range
  koukoku_date_start: null
  koukoku_date_end: null
  kaisatsu_date_type: none
  kaisatsu_date_start: null
  kaisatsu_date_end: null
  keiyaku_date_type: none
  keiyaku_date_start: null
  keiyaku_date_end: null
  koji_shubetsu: ""
  koji_gyoushu: ""
  gyomu_kubun: ""  # gyomu_keikaで使用
  yotei_price_min: null
  yotei_price_max: null
  rakusatsu_price_min: null
  rakusatsu_price_max: null
  rakusatsu_name: ""
  denshi: false
  koukai: false
  display_count: 20

# 旧単一定期実行との互換設定。
# 新しい名前付き定期実行設定はGUIの「定期実行」一覧から作成し、
# config/schedule-registration.json と schedule-profiles/ で管理します。
schedule:
  enabled: false
  backend: windows_task_scheduler
  timezone: Asia/Tokyo
  interval: "daily"  # daily, weekly, monthly
  time: "09:00"      # HH:MM形式
  weekday: "monday"  # weeklyの場合: monday ... sunday
  day_of_month: 1    # monthlyの場合: 1 ... 28
  start_when_available: true  # 実行漏れ時、次回PC利用時に1回実行
  wake_to_run: false           # スリープを解除して実行
  retry_count: 2
  retry_interval_minutes: 15
  notification_policy: off   # off / important_only / all_results / failures_only
  active_profile_id: null      # 旧単一設定の読込互換用。手動編集しない

# ログ設定
logging:
  level: INFO
  file: ./logs/app.log  # プロジェクトルートまたはexe配置場所を基準に解決
  max_bytes: 10485760  # 10MB
  backup_count: 5


<script type="text/javascript">
		//------------------------------------------------
		//関数：sizeChangeTarget()
		//------------------------------------------------
		function sizeChangeTarget() {

			setTimeout(function () {
				// お知らせiframeの高さの調整
				let iframe = document.getElementsByName('service_info')[0];
				let serviceInfo = document.getElementById('service_info');
				serviceInfo.style.height = iframe.contentWindow.document.body.scrollHeight + "px";
			}, 100);
		}
		//------------------------------------------------
		//関数：colorChangeUrl()
		//------------------------------------------------
		function colorChangeUrl(color) {

            var css = document.getElementById('css1');

			if (color === '3') {
                css.setAttribute('href', './css/ppi_main_3.css');
			} else if (color === '2') {
                css.setAttribute('href', './css/ppi_main_2.css');
			} else {
                css.setAttribute('href', './css/ppi_main_1.css');
			}
		}
	</script>
</head>
